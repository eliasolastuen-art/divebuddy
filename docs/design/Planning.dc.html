<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Planning – vecka</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2B5C9E}a:hover{color:#1F4577}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #EEF3F8; color: #1E2B42; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">

  <header style="flex: none; height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #EEF3F8; border-bottom: 1px solid #E1E8F0">
    <button aria-label="Meny" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E8F0; background: #fff; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2B42" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span style="font-size: 18px; font-weight: 800; color: #2B5C9E; letter-spacing: -0.02em">DiveBuddy</span>
  </header>

  <div style="flex: none; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 6px">
      <div style="flex: 1">
        <h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1">Vecka 47</h1>
        <div style="font-size: 14px; color: #56637A; font-weight: 500">16–22 november</div>
      </div>
      <button aria-label="Föregående vecka" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E8F0; background: #fff; font-size: 20px; font-weight: 700; color: #1E2B42">‹</button>
      <button aria-label="Nästa vecka" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E8F0; background: #fff; font-size: 20px; font-weight: 700; color: #1E2B42">›</button>
    </div>
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 13px; background: #DFE7F1">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
        <button onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <sc-for list="{{ days }}" as="d" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="{{ d.headStyle }}">{{ d.label }}</h2>
        <div style="border-radius: 18px; background: #fff; border: 1px solid #E1E8F0; padding: 0 16px">
          <sc-for list="{{ d.items }}" as="p" hint-placeholder-count="2">
            <a href="{{ p.href }}" style="{{ p.rowStyle }}">
              <span style="width: 48px; flex: none; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">{{ p.start }}</span>
              <div style="flex: 1; min-width: 0">
                <div style="font-size: 15px; font-weight: 700">{{ p.group }}</div>
                <div style="{{ p.subStyle }}">{{ p.sub }}</div>
              </div>
              <span aria-hidden="true" style="font-size: 20px; color: #8A96A8; line-height: 1">›</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav style="flex: none; height: 72px; display: flex; justify-content: space-around; align-items: center; background: #fff; border-top: 1px solid #E1E8F0; padding: 0 8px">
    <a href="Main.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56637A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span style="font-size: 11px; font-weight: 500; color: #56637A">Dashboard</span></a>
    <a href="Live.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56637A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg></span><span style="font-size: 11px; font-weight: 500; color: #56637A">Live</span></a>
    <a href="Planning.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; border-radius: 999px; background: #E3ECF7; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B5C9E" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><span style="font-size: 11px; font-weight: 700; color: #2B5C9E">Planning</span></a>
    <a href="Bibliotek.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56637A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></span><span style="font-size: 11px; font-weight: 500; color: #56637A">Library</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { view: 'mina' };
  renderVals() {
    const P = (start, group, training, mine) => ({ start, group, training, mine });
    const all = [
      { label: 'Tisdag 17 nov', items: [ P('16:30','N2','Grundteknik – hopp från kant',0), P('17:00','TG + FG',null,0) ] },
      { label: 'Torsdag 19 nov', today: 1, items: [ P('16:30','N1 Fortsättning',null,0), P('17:00','TG + FG','Teknik: framåt + inåt 3 m',1) ] },
      { label: 'Lördag 21 nov', items: [ P('09:00','N1 Nybörjare',null,0), P('09:30','N2',null,1), P('10:00','FG','Inför Julklappshoppet – serie',1), P('11:30','TG','Tävlingsserie + styrka',1) ] },
      { label: 'Söndag 22 nov', items: [ P('16:30','Vuxen',null,0) ] },
    ];
    const mineOnly = this.state.view === 'mina';
    const days = all.map(d => {
      const items = d.items.filter(p => !mineOnly || p.mine);
      return {
        label: d.today ? d.label + ' · idag' : d.label,
        headStyle: 'margin:0;font-size:15px;font-weight:800;color:' + (d.today ? '#2B5C9E' : '#1E2B42'),
        items: items.map((p, i) => ({
          ...p,
          sub: p.training || 'Planera innehåll', href: p.training ? 'Pass.dc.html' : 'Start.dc.html',
          subStyle: 'font-size:13.5px;margin-top:2px;' + (p.training ? 'color:#56637A;font-weight:500' : 'color:#2B5C9E;font-weight:700'),
          rowStyle: 'text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px;padding:14px 0;' + (i < items.length - 1 ? 'border-bottom:1px solid #E1E8F0' : ''),
        })),
      };
    }).filter(d => d.items.length);
    const tabs = [['mina','Mina pass'],['alla','Alla pass']].map(([k, label]) => ({ label, pick: () => this.setState({ view: k }),
      style: 'flex:1;min-height:40px;border:none;border-radius:10px;font-size:14px;font-weight:700;' + (this.state.view === k ? 'background:#fff;color:#1E2B42' : 'background:transparent;color:#56637A') }));
    return { days, tabs };
  }
}
</script>
</body>
</html>
