<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Bygg passet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2B5C9E}a:hover{color:#1F4577}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #EEF3F8; color: #1E2B42; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">

  <header style="flex: none; height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: #EEF3F8; border-bottom: 1px solid #E1E8F0">
    <a href="PassetUtkast.dc.html" aria-label="Tillbaka till passet" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E8F0; background: #fff; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2B42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 16px; font-weight: 800; letter-spacing: -0.02em">TG + FG</div>
      <div style="font-size: 13px; color: #56637A; font-weight: 500">Torsdag 19 nov 17:00 · <span style="color: #2B5C9E; font-weight: 700">Utkast</span></div>
    </div>
    <button aria-label="Mer" style="width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid #E1E8F0; background: #fff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="#1E2B42" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </header>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 20px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #56637A">Passets namn
      <input type="text" value="Teknik: framåt + inåt 3 m" style="min-height: 48px; border-radius: 14px; border: 1px solid #C9D5E3; background: #fff; padding: 0 14px; font-size: 16px; font-weight: 700; color: #1E2B42; font-family: inherit">
    </label>

    <sc-for list="{{ blocks }}" as="b" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.02em">{{ b.name }}</h2>
        <div style="border-radius: 18px; background: #fff; border: 1px solid #E1E8F0; padding: 0 8px 0 16px">
          <sc-for list="{{ b.items }}" as="it" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #E1E8F0">
              <div style="flex: 1; min-width: 0">
                <div style="font-size: 15px; font-weight: 700">{{ it.name }}</div>
                <button onClick="{{ it.swap }}" style="min-height: 28px; border: none; background: none; padding: 0; font-family: inherit; font-size: 13px; font-weight: 700; color: #2B5C9E; text-align: left">{{ it.swapLabel }}</button>
              </div>
              <button onClick="{{ it.dec }}" aria-label="{{ it.decAria }}" style="width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid #C9D5E3; background: #fff; font-size: 22px; font-weight: 600; color: #2B5C9E; padding: 0">−</button>
              <span style="width: 40px; flex: none; text-align: center; display: flex; flex-direction: column; line-height: 1.1">
                <span style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums">{{ it.n }}</span>
                <span style="font-size: 12px; font-weight: 600; color: #56637A">{{ it.unit }}</span>
              </span>
              <button onClick="{{ it.inc }}" aria-label="{{ it.incAria }}" style="width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid #C9D5E3; background: #fff; font-size: 22px; font-weight: 600; color: #2B5C9E; padding: 0">+</button>
            </div>
          </sc-for>
          <a href="Valj.dc.html" style="display: flex; align-items: center; min-height: 48px; font-size: 15px; font-weight: 700; text-decoration: none">+ Lägg till övningar</a>
        </div>
      </section>
    </sc-for>

    <button style="min-height: 50px; border-radius: 14px; border: 1.5px solid #2B5C9E; background: #fff; color: #2B5C9E; font-size: 15px; font-weight: 700">+ Nytt block</button>
  </div>

  <div style="flex: none; padding: 10px 16px 22px; background: #fff; border-top: 1px solid #E1E8F0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span style="flex: 1; font-size: 14px; font-weight: 700">{{ summary }}</span>
      <span style="font-size: 13px; font-weight: 600; color: #56637A">Ändringar ej sparade</span>
    </div>
    <div style="display: flex; gap: 10px">
      <a href="PassetUtkast.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; border: 1.5px solid #2B5C9E; background: #fff; color: #2B5C9E; font-size: 16px; font-weight: 700; text-decoration: none">Spara utkast</a>
      <a href="PassetPublicerat.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #2B5C9E; color: #fff; font-size: 16px; font-weight: 700; text-decoration: none">Publicera</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { n: { a: 5, b: 10, c: 4, d: 4, e: 3, f: 10 }, min: { a: 1, f: 1 } };
  renderVals() {
    const { n, min } = this.state;
    const I = (id, name, countUnit) => { const isMin = !!min[id]; const step = isMin ? 5 : 1; return { name, n: String(n[id]),
      unit: isMin ? 'min' : countUnit,
      swapLabel: isMin ? 'Byt till antal' : 'Byt till tid',
      swap: () => this.setState({ min: { ...min, [id]: isMin ? 0 : 1 }, n: { ...n, [id]: isMin ? 4 : 10 } }),
      decAria: 'Minska ' + name, incAria: 'Öka ' + name,
      dec: () => this.setState({ n: { ...n, [id]: Math.max(step, n[id] - step) } }),
      inc: () => this.setState({ n: { ...n, [id]: n[id] + step } }) }; };
    const blocks = [
      { name: 'Uppvärmning', items: [ I('a', 'Rörlighet axlar', 'st'), I('b', 'Upphopp på trampett', 'st') ] },
      { name: 'Hopp 3 m', items: [ I('c', '101B Framåt', 'hopp'), I('d', '103B Framåt 1½ volt', 'hopp'), I('e', '401B Inåt', 'hopp'), I('f', '403B Inåt 1½ volt', 'hopp') ] },
    ];
    const ids = ['a', 'b', 'c', 'd', 'e', 'f'];
    const hopp = ['c', 'd', 'e', 'f'].filter(k => !min[k]).reduce((s, k) => s + n[k], 0);
    const tid = ids.filter(k => min[k]).reduce((s, k) => s + n[k], 0);
    return { blocks, summary: hopp + ' hopp' + (tid ? ' · ' + tid + ' min' : '') };
  }
}
</script>
</body>
</html>
