<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Bibliotek</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2B5C9E}a:hover{color:#1F4577}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #EEF3F8; color: #1E2B42; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">

  <header style="flex: none; height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #EEF3F8; border-bottom: 1px solid #E1E8F0">
    <button aria-label="Meny" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E8F0; background: #fff; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2B42" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span style="font-size: 18px; font-weight: 800; color: #2B5C9E; letter-spacing: -0.02em">DiveBuddy</span>
  </header>

  <div style="flex: none; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <h1 style="margin: 0; flex: 1; font-size: 28px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1">Bibliotek</h1>
      <a href="NyOvning.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 14px; background: #2B5C9E; color: #fff; font-size: 15px; font-weight: 700; text-decoration: none">+ Ny övning</a>
    </div>
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 13px; background: #DFE7F1">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <button onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 24px">
    <sc-if value="{{ showTiles }}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{ tiles }}" as="g" hint-placeholder-count="6">
          <button onClick="{{ g.open }}" style="min-height: 92px; border-radius: 18px; border: 1px solid #E1E8F0; background: #fff; padding: 14px 16px; text-align: left; font-family: inherit; color: inherit; display: flex; flex-direction: column; justify-content: space-between; gap: 6px">
            <span style="font-size: 19px; font-weight: 900; letter-spacing: -0.03em">{{ g.name }}</span>
            <span style="font-size: 13.5px; font-weight: 500; color: #56637A">{{ g.sub }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ showList }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <button onClick="{{ back }}" style="align-self: flex-start; min-height: 44px; border: none; background: none; padding: 0; font-family: inherit; font-size: 15px; font-weight: 700; color: #2B5C9E">‹ {{ backLabel }}</button>
        <h2 style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.03em">{{ listTitle }}</h2>
        <div style="border-radius: 18px; background: #fff; border: 1px solid #E1E8F0; padding: 0 16px">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #E1E8F0">
              <span style="flex: 1; font-size: 15px; font-weight: 700">{{ it }}</span>
              <span aria-hidden="true" style="font-size: 20px; color: #8A96A8; line-height: 1">›</span>
            </div>
          </sc-for>
          <a href="NyOvning.dc.html" style="display: flex; align-items: center; min-height: 48px; font-size: 15px; font-weight: 700; text-decoration: none">+ Ny övning här</a>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isMall }}" hint-placeholder-val="{{ false }}">
      <div style="border-radius: 18px; background: #fff; border: 1px solid #E1E8F0; padding: 0 16px">
        <sc-for list="{{ templates }}" as="m" hint-placeholder-count="5">
          <a href="Bygg.dc.html" style="{{ m.rowStyle }}">
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 15px; font-weight: 700">{{ m.name }}</div>
              <div style="font-size: 13px; color: #56637A; font-weight: 500">{{ m.sub }}</div>
            </div>
            <span aria-hidden="true" style="font-size: 20px; color: #8A96A8; line-height: 1">›</span>
          </a>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <nav style="flex: none; height: 72px; display: flex; justify-content: space-around; align-items: center; background: #fff; border-top: 1px solid #E1E8F0; padding: 0 8px">
    <a href="Main.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56637A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span style="font-size: 11px; font-weight: 500; color: #56637A">Dashboard</span></a>
    <a href="Live.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56637A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg></span><span style="font-size: 11px; font-weight: 500; color: #56637A">Live</span></a>
    <a href="Planning.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56637A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><span style="font-size: 11px; font-weight: 500; color: #56637A">Planning</span></a>
    <a href="Bibliotek.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; border-radius: 999px; background: #E3ECF7; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B5C9E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></span><span style="font-size: 11px; font-weight: 700; color: #2B5C9E">Library</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { tab: 'vatten', group: null };
  DATA = {
    vatten: [
      ['100', 'Framåt · 13 hopp', ['101B Framåt', '103B Framåt 1½ volt', '105B Framåt 2½ volt', '107B Framåt 3½ volt']],
      ['200', 'Bakåt · 14 hopp', ['201B Bakåt', '203B Bakåt 1½ volt', '205B Bakåt 2½ volt']],
      ['300', 'Isander · 13 hopp', ['301B Isander', '303B Isander 1½ volt', '305B Isander 2½ volt']],
      ['400', 'Inåt · 11 hopp', ['401B Inåt', '403B Inåt 1½ volt', '405B Inåt 2½ volt']],
      ['Skruvar', '27 hopp', ['5132D Framåt 1½ volt 1 skruv', '5231D Bakåt 1½ volt ½ skruv', '5134D Framåt 1½ volt 2 skruvar']],
      ['Armsving', '6 övningar', ['Armsving framåt', 'Armsving bakåt']],
      ['Fall', '4 övningar', ['Fall framåt', 'Fall bakåt']],
    ],
    land: [
      ['Styrka', 'Kropp och bål', ['Benlyft i ribbstol', 'Planka', 'Upphopp']],
      ['Längor', 'Volter på matta', ['Volt framåt på matta', 'Handstående', 'Flickis']],
      ['Stretch', 'Rörlighet', ['Rörlighet axlar', 'Spagat', 'Pik-stretch']],
      ['Lekar', 'Uppvärmning och avslut', ['Kull', 'Stafett']],
      ['Redskap', 'Trampett, torrbräda, bälte', ['Upphopp på trampett', 'Ansats på torrbräda', 'Volt i bälte']],
    ],
  };
  renderVals() {
    const { tab, group } = this.state;
    const isMall = tab === 'mall';
    const groups = isMall ? [] : this.DATA[tab];
    const g = group && groups.find(x => x[0] === group);
    const tm = [['Teknik framåt 3 m', 'Pass · TG · 6 övningar'], ['Inför tävling – serie', 'Pass · TG · 8 övningar'], ['Grundteknik från kant', 'Pass · N2 · 5 övningar'], ['Uppvärmning land', 'Block · 4 övningar'], ['Styrka Actic', 'Block · 6 övningar']];
    const tabs = [['vatten', 'Vatten'], ['land', 'Land'], ['mall', 'Mallar']].map(([k, label]) => ({ label, pick: () => this.setState({ tab: k, group: null }),
      style: 'flex:1;min-height:40px;border:none;border-radius:10px;font-size:14px;font-weight:700;' + (tab === k ? 'background:#fff;color:#1E2B42' : 'background:transparent;color:#56637A') }));
    return { tabs, isMall, showTiles: !isMall && !g, showList: !isMall && !!g,
      tiles: groups.map(([name, sub]) => ({ name, sub, open: () => this.setState({ group: name }) })),
      items: g ? g[2] : [], listTitle: g ? g[0] : '', back: () => this.setState({ group: null }), backLabel: tab === 'vatten' ? 'Vatten' : 'Land',
      templates: tm.map(([name, sub], i) => ({ name, sub, rowStyle: 'display:flex;align-items:center;gap:12px;padding:14px 0;text-decoration:none;color:inherit;' + (i < tm.length - 1 ? 'border-bottom:1px solid #E1E8F0' : '') })) };
  }
}
</script>
</body>
</html>
