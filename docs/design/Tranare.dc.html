<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Mina pass och närvaro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2B5C9E}a:hover{color:#1F4577}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #EEF3F8; color: #1E2B42; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">

  <header style="flex: none; height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: #EEF3F8; border-bottom: 1px solid #E1E8F0">
    <a href="Main.dc.html" aria-label="Tillbaka" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E8F0; background: #fff; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2B42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.02em">Närvaro</span>
  </header>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 13px; background: #DFE7F1">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
        <button onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>

    <sc-if value="{{ isMine }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 20px">
        <div style="border-radius: 18px; background: #fff; border: 1px solid #E1E8F0; padding: 16px; display: flex; align-items: baseline; gap: 8px">
          <span style="font-size: 26px; font-weight: 900; letter-spacing: -0.04em; color: #2B5C9E">{{ doneCount }}</span>
          <span style="font-size: 15px; font-weight: 600">pass i november · {{ hours }} timmar</span>
        </div>

        <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="2">
          <section style="display: flex; flex-direction: column; gap: 8px">
            <h2 style="margin: 0; font-size: 15px; font-weight: 800">{{ w.label }}</h2>
            <div style="border-radius: 18px; background: #fff; border: 1px solid #E1E8F0; padding: 0 12px 0 16px">
              <sc-for list="{{ w.rows }}" as="r" hint-placeholder-count="3">
                <div style="{{ r.rowStyle }}">
                  <span style="width: 52px; flex: none; font-size: 14px; font-weight: 700; color: #56637A">{{ r.day }}</span>
                  <div style="flex: 1; min-width: 0">
                    <div style="font-size: 15px; font-weight: 700">{{ r.group }}</div>
                    <div style="font-size: 13.5px; color: #56637A; font-weight: 500; font-variant-numeric: tabular-nums">{{ r.time }}</div>
                  </div>
                  <button onClick="{{ r.toggle }}" aria-label="{{ r.aria }}" style="{{ r.checkStyle }}">✓</button>
                </div>
              </sc-for>
            </div>
          </section>
        </sc-for>

        <button style="min-height: 50px; border-radius: 14px; border: 1.5px solid #2B5C9E; background: #fff; color: #2B5C9E; font-size: 15px; font-weight: 700">Lägg till ett pass</button>
      </div>
    </sc-if>

    <sc-if value="{{ isTeam }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <p style="margin: 0; font-size: 14px; color: #56637A; font-weight: 500">Genomförda pass per tränare, hösten 2026.</p>
        <div style="border-radius: 18px; background: #fff; border: 1px solid #E1E8F0; padding: 0 16px">
          <sc-for list="{{ report }}" as="c" hint-placeholder-count="7">
            <div style="{{ c.rowStyle }}">
              <span style="width: 56px; font-size: 15px; font-weight: 700">{{ c.name }}</span>
              <div style="flex: 1; height: 10px; border-radius: 6px; background: #EEF3F8; overflow: hidden"><div style="height: 100%; width: {{ c.pct }}; background: #2B5C9E; border-radius: 6px"></div></div>
              <span style="width: 28px; text-align: right; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">{{ c.n }}</span>
            </div>
          </sc-for>
        </div>
        <button style="min-height: 50px; border-radius: 14px; border: none; background: #2B5C9E; color: #fff; font-size: 15px; font-weight: 700">Exportera till Excel</button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { tab: 'mina', att: { a: 1, b: 1, e: 1 } };
  renderVals() {
    const att = this.state.att;
    const R = (id, day, time, group, mins) => ({ id, day, time, group, mins });
    const mk = rows => rows.map((r, i) => {
      const on = !!att[r.id];
      return { ...r,
        aria: on ? r.group + ' ' + r.day + ': närvarande' : r.group + ' ' + r.day + ': markera närvarande',
        toggle: () => this.setState({ att: { ...att, [r.id]: on ? 0 : 1 } }),
        rowStyle: 'display:flex;align-items:center;gap:12px;padding:10px 0;' + (i < rows.length - 1 ? 'border-bottom:1px solid #E1E8F0' : ''),
        checkStyle: 'width:44px;height:44px;flex:none;border-radius:12px;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;' + (on ? 'background:#2B5C9E;border:2px solid #2B5C9E;color:#fff' : 'background:#fff;border:2px solid #B9C6D8;color:#fff') };
    });
    const w46 = [ R('a','Tis 10','17:00–17:45','N2',45), R('b','Tis 10','17:45–19:00','TG + FG',75), R('c','Tor 12','17:00–19:00','TG + FG',120), R('e','Sön 15','16:30–18:00','TG · extrapass',90) ];
    const w47 = [ R('f','Tor 19','17:45–19:00','TG + FG',75), R('g','Lör 21','09:30–10:45','N2',75), R('h','Lör 21','10:45–11:30','FG',45), R('i','Lör 21','11:30–12:30','TG',60) ];
    const done = w46.concat(w47).filter(r => att[r.id]);
    const priorN = 4, priorMin = 240;
    const hrs = Math.round((priorMin + done.reduce((s, r) => s + r.mins, 0)) / 6) / 10;
    const tabs = [['mina','Mina pass'],['laget','Hela laget']].map(([k, label]) => ({ label, pick: () => this.setState({ tab: k }),
      style: 'flex:1;min-height:40px;border:none;border-radius:10px;font-size:14px;font-weight:700;' + (this.state.tab === k ? 'background:#fff;color:#1E2B42' : 'background:transparent;color:#56637A') }));
    const team = [['Maria',41],['Elias',36],['Anna',28],['Ville',22],['Leo',21],['Vega',20],['Anton',12]];
    return {
      tabs, isMine: this.state.tab === 'mina', isTeam: this.state.tab === 'laget',
      doneCount: String(priorN + done.length), hours: String(hrs).replace('.', ','),
      weeks: [ { label: 'Vecka 46', rows: mk(w46) }, { label: 'Vecka 47', rows: mk(w47) } ],
      report: team.map(([name, n], i) => ({ name, n: String(n), pct: Math.round(n / 41 * 100) + '%',
        rowStyle: 'display:flex;align-items:center;gap:12px;padding:14px 0;' + (i < team.length - 1 ? 'border-bottom:1px solid #E1E8F0' : '') })),
    };
  }
}
</script>
</body>
</html>
