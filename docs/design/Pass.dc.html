<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Pass – detalj</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2B5C9E}a:hover{color:#1F4577}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #7C8A9E; color: #1E2B42; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 690px; background: #fff; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
    <div style="flex: none; display: flex; justify-content: center; padding: 10px 0 2px"><span style="width: 40px; height: 5px; border-radius: 3px; background: #D5DEE9"></span></div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; align-items: flex-start; gap: 12px">
        <div style="flex: 1">
          <div style="font-size: 14px; font-weight: 600; color: #56637A">Torsdag 19 november</div>
          <h1 style="margin: 2px 0 0; font-size: 30px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1; font-variant-numeric: tabular-nums">17:00–19:00</h1>
          <div style="margin-top: 4px; font-size: 16px; font-weight: 700">TG + FG</div>
        </div>
        <a href="Main.dc.html" aria-label="Stäng" style="width: 44px; height: 44px; border-radius: 12px; background: #EEF3F8; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E2B42" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </a>
      </div>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #56637A">Upplägg</h2>
        <div style="border-radius: 16px; border: 1px solid #E1E8F0; padding: 0 16px">
          <div style="display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #E1E8F0">
            <span style="width: 48px; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">17:00</span>
            <span style="width: 60px; font-size: 15px; font-weight: 700">Land</span>
            <span style="flex: 1; font-size: 14px; color: #56637A; font-weight: 500; text-align: right">Maria</span>
          </div>
          <div style="display: flex; align-items: center; gap: 14px; padding: 14px 0">
            <span style="width: 48px; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">17:45</span>
            <span style="width: 60px; font-size: 15px; font-weight: 700">Vatten</span>
            <span style="flex: 1; font-size: 14px; color: #56637A; font-weight: 500; text-align: right">Maria, Elias</span>
          </div>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #56637A">Innehåll</h2>
        <a href="Planning.dc.html" style="text-decoration: none; color: inherit; border-radius: 16px; border: 1px solid #E1E8F0; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
          <div style="flex: 1">
            <div style="font-size: 15px; font-weight: 700">Teknik: framåt + inåt 3 m</div>
            <div style="font-size: 13px; color: #56637A; font-weight: 500; margin-top: 2px">3 block · 18 övningar</div>
          </div>
          <span aria-hidden="true" style="font-size: 22px; color: #2B5C9E; line-height: 1">›</span>
        </a>
      </section>

      <section style="border-radius: 16px; background: #EEF3F8; padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; font-size: 15px; font-weight: 700">Jag är på plats</span>
        <button onClick="{{ toggle }}" aria-label="{{ aria }}" style="{{ checkStyle }}">✓</button>
      </section>
    </div>

    <div style="flex: none; padding: 12px 20px 22px; border-top: 1px solid #E1E8F0; display: flex; flex-direction: column; gap: 4px">
      <a href="Live.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 14px; background: #2B5C9E; color: #fff; font-size: 16px; font-weight: 700; text-decoration: none">Starta live</a>
      <button style="min-height: 44px; border: none; background: none; font-size: 14px; font-weight: 700; color: #2B5C9E">Ändra tid, tränare eller ställ in</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { here: true };
  renderVals() {
    const on = this.state.here;
    return {
      toggle: () => this.setState({ here: !on }),
      aria: on ? 'Närvarande – tryck för att ångra' : 'Markera närvarande',
      checkStyle: 'width:44px;height:44px;border-radius:12px;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;' + (on ? 'background:#2B5C9E;border:2px solid #2B5C9E;color:#fff' : 'background:#fff;border:2px solid #B9C6D8;color:#fff'),
    };
  }
}
</script>
</body>
</html>
