<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Sätt poäng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2B5C9E}a:hover{color:#1F4577}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #7C8A9E; color: #1E2B42; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 700px; background: #fff; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
    <div style="flex: none; display: flex; justify-content: center; padding: 10px 0 2px"><span style="width: 40px; height: 5px; border-radius: 3px; background: #D5DEE9"></span></div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 10px 20px 16px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: flex-start; gap: 12px">
        <div style="flex: 1">
          <div style="font-size: 14px; font-weight: 600; color: #56637A">Sätt poäng · 3 m · 4 hopp</div>
          <h1 style="margin: 2px 0 0; font-size: 26px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1">103B Framåt 1½ volt</h1>
        </div>
        <a href="LivePasset.dc.html" aria-label="Stäng" style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #EEF3F8; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E2B42" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </a>
      </div>
      <div style="border-radius: 16px; border: 1px solid #E1E8F0; padding: 0 8px 0 16px">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
          <div style="{{ r.rowStyle }}">
            <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 700">{{ r.name }}</span>
            <button onClick="{{ r.dec }}" aria-label="{{ r.decAria }}" style="width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid #C9D5E3; background: #fff; font-size: 22px; font-weight: 600; color: #2B5C9E; padding: 0; font-family: inherit">−</button>
            <span style="{{ r.valStyle }}">{{ r.val }}</span>
            <button onClick="{{ r.inc }}" aria-label="{{ r.incAria }}" style="width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid #C9D5E3; background: #fff; font-size: 22px; font-weight: 600; color: #2B5C9E; padding: 0; font-family: inherit">+</button>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="flex: none; padding: 12px 20px 22px; border-top: 1px solid #E1E8F0; display: flex; align-items: center; gap: 14px">
      <span style="flex: 1; font-size: 14px; font-weight: 600; color: #56637A">{{ summary }}</span>
      <a href="LivePasset.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 28px; border-radius: 14px; background: #2B5C9E; color: #fff; font-size: 16px; font-weight: 700; text-decoration: none">Spara poäng</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { s: { a: 7, b: 6.5, c: 7.5, d: null, e: null, f: null } };
  renderVals() {
    const { s } = this.state;
    const names = { a: 'Anton', b: 'Elsa', c: 'Maja', d: 'Noah', e: 'Saga', f: 'Vera' };
    const ids = Object.keys(names);
    const set = (id, v) => this.setState({ s: { ...s, [id]: Math.max(0, Math.min(10, v)) } });
    const rows = ids.map((id, i) => {
      const v = s[id];
      return { name: names[id], val: v == null ? '–' : v.toFixed(1).replace('.', ','),
        decAria: 'Sänk poäng för ' + names[id], incAria: 'Höj poäng för ' + names[id],
        dec: () => set(id, (v == null ? 7 : v) - 0.5), inc: () => set(id, v == null ? 7 : v + 0.5),
        rowStyle: 'display:flex;align-items:center;gap:8px;padding:8px 0;' + (i < ids.length - 1 ? 'border-bottom:1px solid #E1E8F0' : ''),
        valStyle: 'width:48px;flex:none;text-align:center;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:' + (v == null ? '#56637A' : '#1E2B42') };
    });
    const n = ids.filter(id => s[id] != null).length;
    return { rows, summary: n + ' av ' + ids.length + ' har poäng' };
  }
}
</script>
</body>
</html>
