<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Live – publicerade pass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2B5C9E}a:hover{color:#1F4577}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #EEF3F8; color: #1E2B42; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">
  <header style="flex: none; height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #EEF3F8; border-bottom: 1px solid #E1E8F0">
    <button aria-label="Meny" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E8F0; background: #fff; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2B42" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span style="font-size: 18px; font-weight: 800; color: #2B5C9E; letter-spacing: -0.02em">DiveBuddy</span>
  </header>
  <div style="flex: none; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 6px">
      <div style="flex: 1">
        <h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1">{{ dayTitle }}</h1>
        <div style="font-size: 14px; color: #56637A; font-weight: 500">{{ daySub }}</div>
      </div>
      <button aria-label="Föregående vecka" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E8F0; background: #fff; font-size: 20px; font-weight: 700; color: #1E2B42">‹</button>
      <button aria-label="Nästa vecka" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E8F0; background: #fff; font-size: 20px; font-weight: 700; color: #1E2B42">›</button>
    </div>
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 13px; background: #DFE7F1">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
        <button onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 4px">
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
        <button onClick="{{ d.pick }}" aria-pressed="{{ d.pressed }}" aria-label="{{ d.aria }}" style="{{ d.style }}">
          <span style="font-size: 12px; font-weight: 600">{{ d.letter }}</span>
          <span style="font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">{{ d.num }}</span>
          <span style="{{ d.dotStyle }}"></span>
        </button>
      </sc-for>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 800">{{ c.heading }}</h2>
        <div style="border-radius: 20px; color: #fff; padding: 18px; display: flex; flex-direction: column; gap: 3px; background: linear-gradient(135deg, oklch(0.50 0.10 232), oklch(0.42 0.10 256))">
          <span style="font-size: 14px; font-weight: 700">{{ c.top }}</span>
          <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15">{{ c.group }}</span>
          <span style="font-size: 15px; font-weight: 700">{{ c.title }}</span>
          <span style="font-size: 13.5px; font-weight: 500">{{ c.sub }}</span>
          <a href="LivePasset.dc.html" style="margin-top: 10px; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 14px; background: #fff; color: #234E88; font-size: 16px; font-weight: 800; text-decoration: none">{{ c.btn }}</a>
        </div>
      </section>
    </sc-for>
    <div style="{{ emptyStyle }}">
      <p style="margin: 0; padding: 14px 0; font-size: 15px; color: #56637A; font-weight: 500">Inga publicerade pass den här dagen. Utkast publicerar du i <a href="Planning.dc.html" style="font-weight: 700; text-decoration: none">Planning</a>.</p>
    </div>
  </div>
  <nav style="flex: none; height: 72px; display: flex; justify-content: space-around; align-items: center; background: #fff; border-top: 1px solid #E1E8F0; padding: 0 8px">
    <a href="#" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56637A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span style="font-size: 11px; font-weight: 500; color: #56637A">Dashboard</span></a>
    <a href="Live.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; border-radius: 999px; background: #E3ECF7; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B5C9E" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg></span><span style="font-size: 11px; font-weight: 700; color: #2B5C9E">Live</span></a>
    <a href="Planning.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56637A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><span style="font-size: 11px; font-weight: 500; color: #56637A">Planning</span></a>
    <a href="#" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px"><span style="width: 48px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56637A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></span><span style="font-size: 11px; font-weight: 500; color: #56637A">Library</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { day: 0, scope: 'mina' };
  renderVals() {
    const { day, scope } = this.state;
    const names = ['Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lördag', 'Söndag'];
    const C = (d, mine, top, group, title, sub, btn) => ({ d, mine, top, group, title, sub, btn });
    const all = [
      C(0, 1, '17:00–19:00 · pågår 52 min', 'TG + FG', 'Styrka + grundhopp 1 m', 'Land 17:00, vatten 17:45 · Maria och Elias', 'Fortsätt passet'),
      C(0, 0, '18:00–19:30', 'N3', 'Volter från 1 m', 'Vatten · Vega', 'Starta passet'),
      C(2, 0, '16:30–18:00', 'N1', 'Grundhopp 1 m', 'Vatten · Ville', 'Starta passet'),
      C(5, 1, '09:30–11:00', 'N2', 'Skruvar 1 m', 'Vatten · Elias', 'Starta passet'),
    ];
    const open = { heading: 'Inte avslutat', top: 'Lördag 14 nov · 4 av 6 övningar klara', group: 'N2', title: 'Armsving och fall', sub: 'Vatten · Elias', btn: 'Fortsätt passet' };
    const inScope = c => scope === 'alla' || c.mine;
    const todays = all.filter(c => c.d === day && inScope(c)).map(c => ({ ...c, heading: day === 0 ? 'Idag' : names[day] }));
    const cards = [open, ...todays];
    const tab = (id, label) => ({ label, pressed: scope === id ? 'true' : 'false', pick: () => this.setState({ scope: id }),
      style: 'flex:1;min-height:40px;border:none;border-radius:10px;font-size:14px;font-family:inherit;' + (scope === id ? 'background:#fff;color:#1E2B42;font-weight:700' : 'background:none;color:#56637A;font-weight:600') });
    const days = names.map((n, i) => {
      const on = i === day, has = all.some(c => c.d === i && inScope(c));
      return { letter: n[0], num: String(16 + i), pressed: on ? 'true' : 'false', aria: n + ' ' + (16 + i) + ' november' + (has ? ', har pass' : ''),
        pick: () => this.setState({ day: i }),
        style: 'flex:1;min-height:60px;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;' + (on ? 'background:#2B5C9E;color:#fff;border:1px solid #2B5C9E' : 'background:#fff;color:#1E2B42;border:1px solid #E1E8F0'),
        dotStyle: 'width:6px;height:6px;border-radius:50%;background:' + (has ? (on ? '#fff' : '#2B5C9E') : 'transparent') };
    });
    return { cards, days, tabs: [tab('mina', 'Mina pass'), tab('alla', 'Alla pass')],
      dayTitle: day === 0 ? 'Idag' : names[day], daySub: names[day] + ' ' + (16 + day) + ' november · vecka 47',
      emptyStyle: 'border-radius:18px;background:#fff;border:1px solid #E1E8F0;padding:0 16px;display:' + (todays.length ? 'none' : 'block') };
  }
}
</script>
</body>
</html>
